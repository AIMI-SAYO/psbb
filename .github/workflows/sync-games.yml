name: Sync game list

# Copies the live game list into docs/games.json, so the list is kept on GitHub
# and served by the website even if the live service is unreachable.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-games
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the live list
        env:
          # The service's direct address, kept as a secret. The public address
          # sits behind Cloudflare's bot protection, which blocks this runner.
          LIST_SOURCE: ${{ secrets.LIST_SOURCE }}
        run: |
          curl -fsS --max-time 30 "$LIST_SOURCE" -o /tmp/games.json
          # Only accept a well-formed list whose files are on PlayStation's download servers.
          jq -e '
            (.games | type == "array") and
            all(.games[]; (.host == "gst.prod.dl.playstation.net" or .host == "gs2.ww.prod.dl.playstation.net")
                          and (.path | test("^/[A-Za-z0-9_./-]+\\.pkg$")))
          ' /tmp/games.json > /dev/null
          jq --indent 1 . /tmp/games.json > docs/games.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/games.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "psbb-list-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/games.json
          git commit -m "Update game list"
          git push
